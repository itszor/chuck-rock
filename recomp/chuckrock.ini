; libroger's settings for chuckrock (beside it, as <program>.ini)

[crop]
; --crop: the rows of the 256-line screen to show (FIRST-LAST, or all),
; to start with and from when the code at an address first runs (in hex)

; ChuckProg: the Krisalis logo fills the screen, the intro's story uses
; rows 0-247 and its scenes 0-199
rows = all
; GAME, from the stub ChuckProg copies to &28800 to load it: the title uses
; rows 14-213, the game 14-232 (the play area and the panel below it)
28800 = 14-232
